[project]
name = "verifin"
version = "1.0.0"
description = "Self-auditing RAG assistant — every sentence is cited or flagged unverified."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines in prompts/docstrings are fine

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
