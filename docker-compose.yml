services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Reach Qdrant by its service name inside the compose network.
      QDRANT_HOST: qdrant
    depends_on:
      - qdrant

volumes:
  qdrant_data:
